services:
  train:
    build: .
    image: godhaar-muzzle-reid-train:latest
    # Requires nvidia-container-toolkit on the host (already implied by
    # "docker can see the GPU" — this is the standard way compose exposes
    # it; older Docker/nvidia-docker2 setups may need `runtime: nvidia`
    # instead of this `deploy.resources` block).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # PyTorch's DataLoader (num_workers=2, persistent_workers=True in
    # train_dinov2_arcface.py) passes batches between the main process and
    # worker processes via /dev/shm. Docker containers default to a tiny
    # 64MB shm, which is not enough -- without this, torch's DataLoader
    # workers fail with "unable to allocate shared memory(shm)" on the
    # very first batch. 2GB is generous for this dataset's batch sizes
    # (well over what's needed even at the a6000 preset's batch=32) but
    # costs nothing to reserve.
    shm_size: '2gb'
    volumes:
      # Checkpoints/metrics survive `docker compose down` / a container
      # replace — without this they'd be lost with the container.
      - ./checkpoints:/workspace/checkpoints
      - ./results:/workspace/results
      # The dataset is mounted, not baked into the image. DATA_DIR points at
      # whichever corpus this run trains on:
      #   pretrain  -> the 300-identity corpus (17GB, 2,899 images)
      #   fine-tune -> the Uttarakhand split   (120MB, 439 train images)
      # Same image, same code, only the mount changes. Read-only so a
      # training run can never mutate the corpus it is measured against.
      - ${DATA_DIR:-./data}:/workspace/data:ro
    command: ["--gpu-preset", "auto"]
