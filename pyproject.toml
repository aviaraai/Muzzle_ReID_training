[project]
name = "Muzzle_ReID_training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "faiss-cpu>=1.14.3",
    "huggingface-hub>=1.20.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pytorch-metric-learning>=2.8.1",
    "timm>=1.0.27",
    "torch",
    "torchvision",
    "tqdm>=4.68.3",
]

[tool.uv.workspace]
members = [
    "benchmark",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
